services:
  # ─── Base de datos PostgreSQL ───────────────────────────────
  postgres:
    # Minor pin (antes 16-alpine, que flota por minor). 16.4 fija la minor y deja
    # flotar sólo la patch dentro de una línea estable de larga vida. NO cambiar la
    # major (16) sin migración planificada del volumen de datos.
    image: postgres:16.4-alpine
    container_name: visioncore_postgres
    restart: unless-stopped
    environment:
      POSTGRES_DB: visioncore_db
      POSTGRES_USER: visioncore
      # Sin default hardcodeado. Debe venir de .env / entorno (ver .env.example).
      # Se usa la forma ${VAR:-} (vacío si falta) a propósito: `docker compose config`
      # sigue validando sin .env (CI), y `docker compose up` falla claro porque
      # postgres rechaza una contraseña vacía = fail-fast deseado. NO usar la forma
      # ${VAR:?...} porque rompe `docker compose config` sin .env.
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-}
    volumes:
      - postgres_data:/var/lib/postgresql/data
    ports:
      # Sólo accesible desde el host (localhost), nunca desde la red externa.
      # Los servicios internos usan la red docker (postgres:5432), no este mapeo.
      - "127.0.0.1:5432:5432"
    networks:
      - visioncore_net
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U visioncore -d visioncore_db"]
      interval: 10s
      timeout: 5s
      retries: 5

  # ─── Redis (sesiones y caché) ───────────────────────────────
  redis:
    # Minor pin (antes 7-alpine). 7.4 fija la minor, patch flotante en línea estable.
    image: redis:7.4-alpine
    container_name: visioncore_redis
    restart: unless-stopped
    command: redis-server --appendonly yes --maxmemory 256mb --maxmemory-policy allkeys-lru
    volumes:
      - redis_data:/data
    ports:
      # Sólo localhost del host — nunca expuesto a la red externa.
      - "127.0.0.1:6379:6379"
    networks:
      - visioncore_net
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 5s
      retries: 5

  # ─── MediaMTX (proxy RTSP → HLS/WebRTC) ────────────────────
  mediamtx:
    # Pin fijo (antes :latest). 1.9.3 es una release estable conocida de la línea
    # 1.9.x; evita que un `pull` futuro cambie el comportamiento del componente
    # crítico de streaming. Actualizar deliberadamente, no por deriva del tag.
    image: bluenviron/mediamtx:1.9.3
    container_name: visioncore_mediamtx
    restart: unless-stopped
    environment:
      MTX_PROTOCOLS: tcp
    volumes:
      - ./infra/mediamtx/mediamtx.yml:/mediamtx.yml:ro
    ports:
      # Puertos de medios atados a loopback: Nginx los alcanza por la red interna
      # de docker; no deben quedar expuestos a todas las interfaces (MediaMTX corre
      # con user: any). Ver AUDIT_DEVOPS / AUDIT_SECURITY (P1 superficie de medios).
      - "127.0.0.1:8554:8554"   # RTSP
      - "127.0.0.1:8888:8888"   # HLS
      - "127.0.0.1:8889:8889"   # WebRTC
      # API REST de MediaMTX: interna (la usa el API vía red docker) — sólo localhost.
      - "127.0.0.1:9997:9997"
    networks:
      - visioncore_net
    extra_hosts:
      - "host.docker.internal:host-gateway"

  # ─── API Backend (Fastify) ──────────────────────────────────
  api:
    build:
      context: .
      dockerfile: apps/api/Dockerfile
      args:
        # Bakes current commit into the image so GET /api/health shows which build is running.
        # Run: COMMIT_SHA=$(git rev-parse --short HEAD) docker compose up --build
        COMMIT_SHA: ${COMMIT_SHA:-development}
    container_name: visioncore_api
    restart: unless-stopped
    env_file:
      - path: .env
        required: false
    environment:
      DATABASE_URL: postgresql://visioncore:${POSTGRES_PASSWORD:-}@postgres:5432/visioncore_db
      REDIS_URL: redis://redis:6379
      MEDIAMTX_URL: http://mediamtx:9997
      # Claves — generar con: openssl rand -hex 64 / openssl rand -hex 32
      JWT_SECRET: ${JWT_SECRET:-visioncore_default_dev_secret_change_in_production_32c}
      JWT_EXPIRES_IN: ${JWT_EXPIRES_IN:-60m}
      JWT_REFRESH_EXPIRES_IN: ${JWT_REFRESH_EXPIRES_IN:-7d}
      NVR_CREDENTIAL_KEY: ${NVR_CREDENTIAL_KEY:-}
      CORS_ORIGINS: ${CORS_ORIGINS:-}
      # Poner true solo si el sitio tiene HTTPS — false en HTTP o las cookies no se envían
      COOKIE_SECURE: ${COOKIE_SECURE:-false}
      APP_URL: ${APP_URL:-http://localhost:4000}
      SMTP_HOST: ${SMTP_HOST:-}
      SMTP_PORT: ${SMTP_PORT:-587}
      SMTP_SECURE: ${SMTP_SECURE:-false}
      SMTP_USER: ${SMTP_USER:-}
      SMTP_PASS: ${SMTP_PASS:-}
      SMTP_FROM: ${SMTP_FROM:-}
      UPLOADS_DIR: /app/uploads
      # ── Grabaciones VOD ──────────────────────────────────────────
      # Cache persistente de MP4 generados (segunda apertura < 1 s)
      RECORDINGS_CACHE_DIR: /var/lib/visioncore/recordings-cache
      RECORDINGS_CACHE_MAX_GB: "20"
      RECORDINGS_CACHE_TTL_HOURS: "24"
      # Parámetros de transcode HEVC → H.264 (CRF 28 + 2 Mbps cap reduce ~48 MB a ~12-15 MB)
      RECORDINGS_TRANSCODE_PRESET: ultrafast
      RECORDINGS_TRANSCODE_CRF: "28"
      RECORDINGS_TRANSCODE_MAXRATE: 2000k
      RECORDINGS_TRANSCODE_BUFSIZE: 4000k
      RECORDINGS_TRANSCODE_MAX_WIDTH: "1280"
      RECORDINGS_FORCE_TRANSCODE: "false"
      # Watchdog de primer byte por variante RTSP (mata FFmpeg colgado y avanza
      # la cadena de fallback), gracia SIGTERM→SIGKILL y presupuesto total.
      RECORDINGS_PREVIEW_FIRST_BYTE_TIMEOUT_MS: ${RECORDINGS_PREVIEW_FIRST_BYTE_TIMEOUT_MS:-25000}
      RECORDINGS_PREVIEW_KILL_GRACE_MS: ${RECORDINGS_PREVIEW_KILL_GRACE_MS:-2000}
      RECORDINGS_TERMINATION_WAIT_MS: ${RECORDINGS_TERMINATION_WAIT_MS:-12000}
      RECORDINGS_EXIT_CONFIRMATION_MARGIN_MS: ${RECORDINGS_EXIT_CONFIRMATION_MARGIN_MS:-3000}
      RECORDINGS_UNCONSUMED_LEASE_MS: ${RECORDINGS_UNCONSUMED_LEASE_MS:-45000}
      RECORDINGS_NVR_CAPACITY_COOLDOWN_MS: ${RECORDINGS_NVR_CAPACITY_COOLDOWN_MS:-120000}
      RECORDINGS_PREVIEW_TOTAL_STARTUP_MS: ${RECORDINGS_PREVIEW_TOTAL_STARTUP_MS:-60000}
      # ── Vigencia de sesiones de LiveView ─────────────────────
      # Único criterio: heartbeat de CLIENTE. Ni el proceso vivo ni la actividad
      # de medio prolongan una sesión. STREAM_HD_IDLE_TIMEOUT aplica a las
      # sesiones transcodificadas con la pestaña en segundo plano.
      STREAM_IDLE_TIMEOUT: ${STREAM_IDLE_TIMEOUT:-90}
      STREAM_HD_IDLE_TIMEOUT: ${STREAM_HD_IDLE_TIMEOUT:-90}
      # ── Analítica de video ───────────────────────────────────
      # Secreto compartido con el servicio analytics (openssl rand -hex 32).
      # Vacío = endpoints de analítica deshabilitados.
      ANALYTICS_SECRET: ${ANALYTICS_SECRET:-}
      ANALYTICS_URL: http://analytics:8500
      ANALYTICS_MEDIAMTX_RTSP: rtsp://mediamtx:8554
      ANALYTICS_ALPR_ENABLED: ${ANALYTICS_ALPR_ENABLED:-false}
      # false = analytics SOLO usa el restream de MediaMTX (recomendado, no
      # tumba live view). true = permite fallback RTSP directo al NVR.
      ANALYTICS_ALLOW_DIRECT_RTSP: ${ANALYTICS_ALLOW_DIRECT_RTSP:-false}
      # Token opcional para /metrics (Prometheus). Vacío = red interna.
      METRICS_TOKEN: ${METRICS_TOKEN:-}
    volumes:
      - uploads_data:/app/uploads
      - recordings_cache:/var/lib/visioncore/recordings-cache
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    # Healthcheck: nginx puede esperar a que el API esté listo (start_period cubre
    # el arranque) en vez de dar 502 transitorios durante la recreación.
    # Healthcheck: usa 127.0.0.1 explícito (no 'localhost', que puede resolver a
    # [::1] y fallar) vía fetch de Node — sin depender de wget/curl en la imagen.
    # start_period amplio para cubrir migraciones + arranque en el primer deploy.
    healthcheck:
      test: ["CMD", "node", "-e", "fetch('http://127.0.0.1:4000/api/health').then(r => process.exit(r.ok ? 0 : 1)).catch(() => process.exit(1))"]
      interval: 15s
      timeout: 5s
      retries: 8
      start_period: 150s
    ports:
      # Detrás de nginx: nginx llega por la red docker (api:4000), este mapeo es
      # sólo para acceso directo/depuración desde el host → localhost únicamente.
      - "127.0.0.1:4000:4000"
    networks:
      - visioncore_net
    # Allow the API container to resolve external hostnames (e.g. SMTP servers).
    # Docker's embedded resolver handles internal service names (postgres, redis, etc.)
    # regardless of this setting; these DNS servers are only used for external lookups.
    # If the SMTP server is on an internal network not reachable via public DNS, also
    # add an extra_hosts entry: "webmail.example.com:<REAL_IP>"
    dns:
      - 8.8.8.8
      - 1.1.1.1
    extra_hosts:
      - "host.docker.internal:host-gateway"

  # ─── Frontend (React + Nginx) ───────────────────────────────
  web:
    build:
      context: ./apps/web
      dockerfile: Dockerfile
    container_name: visioncore_web
    restart: unless-stopped
    depends_on:
      - api
    networks:
      - visioncore_net
    # Healthcheck: la imagen es nginx:alpine (busybox). Se usa el wget de busybox
    # (no hay curl) para pedir la raíz del estático servido en :80. 127.0.0.1
    # explícito para no depender de la resolución IPv6 de 'localhost'.
    healthcheck:
      test: ["CMD-SHELL", "wget -q -O /dev/null http://127.0.0.1:80/ || exit 1"]
      interval: 15s
      timeout: 5s
      retries: 5
      start_period: 20s

  # ─── Analítica de video (Supervision + YOLOX/ONNX) ─────────
  # CPU por defecto. Para GPU NVIDIA ver apps/analytics/README.md.
  analytics:
    build:
      context: ./apps/analytics
      dockerfile: Dockerfile
    container_name: visioncore_analytics
    restart: unless-stopped
    environment:
      API_BASE_URL: http://api:4000
      ANALYTICS_SECRET: ${ANALYTICS_SECRET:-}
      ANALYTICS_PROVIDER: ${ANALYTICS_PROVIDER:-yolox_onnx}
      MODEL_PATH: /models/yolox_s.onnx
      INPUT_SIZE: "640"
      ANALYTICS_MAX_WORKERS: ${ANALYTICS_MAX_WORKERS:-16}
      ANALYTICS_FALL_DETECTION_ENABLED: ${ANALYTICS_FALL_DETECTION_ENABLED:-false}
      ANALYTICS_ALPR_ENABLED: ${ANALYTICS_ALPR_ENABLED:-false}
      # ── Ingestor de Frigate (fuente externa de detección) ────────
      # Con FRIGATE_ENABLED=false el ingestor NO arranca ⇒ comportamiento idéntico.
      # Frigate corre como servicio aparte bajo el profile "frigate" (no arranca
      # en el `docker compose up` por defecto). Ver docs/frigate/DEPLOYMENT.md.
      FRIGATE_ENABLED: ${FRIGATE_ENABLED:-false}
      FRIGATE_URL: ${FRIGATE_URL:-http://frigate:5000}
      FRIGATE_INGEST_MODE: ${FRIGATE_INGEST_MODE:-http}
      FRIGATE_POLL_INTERVAL_SEC: ${FRIGATE_POLL_INTERVAL_SEC:-5}
      FRIGATE_CAMERA_MAP: ${FRIGATE_CAMERA_MAP:-}
      FRIGATE_FETCH_SNAPSHOTS: ${FRIGATE_FETCH_SNAPSHOTS:-true}
      FRIGATE_MIN_CONFIDENCE: ${FRIGATE_MIN_CONFIDENCE:-0.6}
      FRIGATE_SUPPORTED_CLASSES: ${FRIGATE_SUPPORTED_CLASSES:-person,car,truck,bus,motorcycle,bicycle}
    volumes:
      - analytics_models:/models
    depends_on:
      - api
    networks:
      - visioncore_net
    # El modelo se descarga de GitHub al primer arranque
    dns:
      - 8.8.8.8
      - 1.1.1.1
    # Healthcheck: la imagen trae curl. GET /health responde 200 mientras FastAPI
    # viva (a propósito no refleja el estado del modelo — eso se ve en /status — para
    # no reiniciar el contenedor por un modelo caído). start_period amplio porque el
    # modelo ONNX se descarga en el primer arranque.
    healthcheck:
      test: ["CMD-SHELL", "curl -fsS http://127.0.0.1:8500/health || exit 1"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 60s

  # ─── Frigate (NVR con detección de objetos — fuente de analítica) ──
  # OPT-IN: sólo arranca con `docker compose --profile frigate up -d frigate`.
  # Sin el profile, el stack por defecto NO lo levanta (comportamiento idéntico).
  # La API interna (5000) queda SOLO en la red docker (la consume el ingestor de
  # analytics como http://frigate:5000); la UI autenticada (8971) se ata a loopback.
  # Detector CPU por defecto; para Coral TPU / GPU NVIDIA ver docs/frigate/DEPLOYMENT.md.
  # El config real (con IPs/credenciales) es infra/frigate/config.yml (gitignored);
  # copiar de infra/frigate/config.example.yml. Nunca versionar credenciales/IPs.
  frigate:
    # Pin fijo (antes :stable, que flota). 0.14.1 es la última patch estable de la
    # línea 0.14.x. Frigate es opt-in (profile) y no arranca en el stack por defecto.
    image: ghcr.io/blakeblackshear/frigate:0.14.1
    container_name: visioncore_frigate
    profiles: ["frigate"]
    restart: unless-stopped
    shm_size: ${FRIGATE_SHM_SIZE:-256mb}
    environment:
      # Substitución en config.yml vía {FRIGATE_RTSP_PASSWORD}. Nunca en el repo.
      FRIGATE_RTSP_PASSWORD: ${FRIGATE_RTSP_PASSWORD:-}
    volumes:
      - /etc/localtime:/etc/localtime:ro
      - ./infra/frigate/config.yml:/config/config.yml:ro
      - frigate_media:/media/frigate
    tmpfs:
      - /tmp/cache:size=1000000000
    ports:
      # UI autenticada de Frigate — sólo localhost del host.
      - "127.0.0.1:8971:8971"
      # NOTA: la API interna (5000) NO se publica: el ingestor la alcanza por la
      # red docker (frigate:5000). No exponer 5000 ni go2rtc a la red externa.
    networks:
      - visioncore_net
    extra_hosts:
      - "host.docker.internal:host-gateway"
    # Healthcheck: la imagen de Frigate (Debian) trae curl. GET /api/version en la
    # API interna (5000). Servicio opt-in (profile "frigate"): no arranca en el stack
    # por defecto y ningún otro servicio depende de él, así que este check no afecta
    # el arranque normal. start_period amplio (Frigate tarda en levantar detectores).
    healthcheck:
      test: ["CMD-SHELL", "curl -fsS http://127.0.0.1:5000/api/version || exit 1"]
      interval: 30s
      timeout: 5s
      retries: 5
      start_period: 60s

  # ─── Nginx (reverse proxy + SSL) ───────────────────────────
  nginx:
    # Minor pin (antes nginx:alpine). 1.27 fija la minor estable, patch flotante.
    image: nginx:1.27-alpine
    container_name: visioncore_nginx
    restart: unless-stopped
    volumes:
      - ./infra/nginx/nginx.conf:/etc/nginx/nginx.conf:ro
      - certbot_conf:/etc/letsencrypt:ro
      - certbot_www:/var/www/certbot:ro
    ports:
      - "80:80"
      - "443:443"
    # A3 — Recarga periódica para tomar los certs que renueva el contenedor certbot.
    # certbot escribe los certs en el volumen compartido certbot_conf pero NO recarga
    # nginx; sin esto nginx sirve el cert viejo hasta un reload manual (outage ~90d).
    # Patrón estándar cross-container: nginx se recarga a sí mismo cada 6h (no usa
    # `docker exec` ni señalización externa). El $${!} se escapa ($$→$) para que lo
    # interprete el shell del contenedor, no la interpolación de compose.
    command: ["/bin/sh", "-c", "while :; do sleep 6h & wait $${!}; nginx -s reload; done & nginx -g 'daemon off;'"]
    depends_on:
      # Esperar a que el API esté SANO (no sólo iniciado) para no producir 502
      # transitorios mientras corren migraciones / arranque. web también se espera
      # SANO (ya tiene healthcheck). mediamtx corre desde una imagen `scratch` (sin
      # shell ni cliente HTTP) por lo que no admite un healthcheck interno estándar
      # → se mantiene service_started.
      api:
        condition: service_healthy
      web:
        condition: service_healthy
      mediamtx:
        condition: service_started
    networks:
      - visioncore_net

  # ─── Certbot (renovación automática SSL) ────────────────────
  certbot:
    # Pin fijo (antes :latest). v3.0.1 es una release estable conocida; evita que
    # una renovación futura traiga un certbot con flags/comportamiento distinto.
    image: certbot/certbot:v3.0.1
    container_name: visioncore_certbot
    restart: unless-stopped
    volumes:
      - certbot_conf:/etc/letsencrypt
      - certbot_www:/var/www/certbot
    entrypoint: "/bin/sh -c 'trap exit TERM; while :; do certbot renew --quiet; sleep 12h & wait $${!}; done;'"

volumes:
  postgres_data:
  redis_data:
  certbot_conf:
  certbot_www:
  uploads_data:
  recordings_cache:
  analytics_models:
  frigate_media:

networks:
  visioncore_net:
    driver: bridge
