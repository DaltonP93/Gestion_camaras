services:
  # ─── Base de datos PostgreSQL ───────────────────────────────
  postgres:
    image: postgres:16-alpine
    container_name: visioncore_postgres
    restart: unless-stopped
    environment:
      POSTGRES_DB: visioncore_db
      POSTGRES_USER: visioncore
      POSTGRES_PASSWORD: visioncore_pass
    volumes:
      - postgres_data:/var/lib/postgresql/data
    ports:
      - "5432:5432"
    networks:
      - visioncore_net
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U visioncore -d visioncore_db"]
      interval: 10s
      timeout: 5s
      retries: 5

  # ─── Redis (sesiones y caché) ───────────────────────────────
  redis:
    image: redis:7-alpine
    container_name: visioncore_redis
    restart: unless-stopped
    command: redis-server --appendonly yes --maxmemory 256mb --maxmemory-policy allkeys-lru
    volumes:
      - redis_data:/data
    ports:
      - "6379:6379"
    networks:
      - visioncore_net
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 5s
      retries: 5

  # ─── MediaMTX (proxy RTSP → HLS/WebRTC) ────────────────────
  mediamtx:
    image: bluenviron/mediamtx:latest
    container_name: visioncore_mediamtx
    restart: unless-stopped
    environment:
      MTX_PROTOCOLS: tcp
    volumes:
      - ./infra/mediamtx/mediamtx.yml:/mediamtx.yml:ro
    ports:
      - "8554:8554"   # RTSP
      - "8888:8888"   # HLS
      - "8889:8889"   # WebRTC
      - "9997:9997"   # API REST de MediaMTX
    networks:
      - visioncore_net
    extra_hosts:
      - "host.docker.internal:host-gateway"

  # ─── API Backend (Fastify) ──────────────────────────────────
  api:
    build:
      context: .
      dockerfile: apps/api/Dockerfile
      args:
        # Bakes current commit into the image so GET /api/health shows which build is running.
        # Run: COMMIT_SHA=$(git rev-parse --short HEAD) docker compose up --build
        COMMIT_SHA: ${COMMIT_SHA:-development}
    container_name: visioncore_api
    restart: unless-stopped
    env_file:
      - path: .env
        required: false
    environment:
      DATABASE_URL: postgresql://visioncore:visioncore_pass@postgres:5432/visioncore_db
      REDIS_URL: redis://redis:6379
      MEDIAMTX_URL: http://mediamtx:9997
      # Claves — generar con: openssl rand -hex 64 / openssl rand -hex 32
      JWT_SECRET: ${JWT_SECRET:-visioncore_default_dev_secret_change_in_production_32c}
      JWT_EXPIRES_IN: ${JWT_EXPIRES_IN:-60m}
      JWT_REFRESH_EXPIRES_IN: ${JWT_REFRESH_EXPIRES_IN:-7d}
      NVR_CREDENTIAL_KEY: ${NVR_CREDENTIAL_KEY:-}
      CORS_ORIGINS: ${CORS_ORIGINS:-}
      # Poner true solo si el sitio tiene HTTPS — false en HTTP o las cookies no se envían
      COOKIE_SECURE: ${COOKIE_SECURE:-false}
      APP_URL: ${APP_URL:-http://localhost:4000}
      SMTP_HOST: ${SMTP_HOST:-}
      SMTP_PORT: ${SMTP_PORT:-587}
      SMTP_SECURE: ${SMTP_SECURE:-false}
      SMTP_USER: ${SMTP_USER:-}
      SMTP_PASS: ${SMTP_PASS:-}
      SMTP_FROM: ${SMTP_FROM:-}
      UPLOADS_DIR: /app/uploads
      # ── Grabaciones VOD ──────────────────────────────────────────
      # Cache persistente de MP4 generados (segunda apertura < 1 s)
      RECORDINGS_CACHE_DIR: /var/lib/visioncore/recordings-cache
      RECORDINGS_CACHE_MAX_GB: "20"
      RECORDINGS_CACHE_TTL_HOURS: "24"
      # Parámetros de transcode HEVC → H.264 (CRF 28 + 2 Mbps cap reduce ~48 MB a ~12-15 MB)
      RECORDINGS_TRANSCODE_PRESET: ultrafast
      RECORDINGS_TRANSCODE_CRF: "28"
      RECORDINGS_TRANSCODE_MAXRATE: 2000k
      RECORDINGS_TRANSCODE_BUFSIZE: 4000k
      RECORDINGS_TRANSCODE_MAX_WIDTH: "1280"
      RECORDINGS_FORCE_TRANSCODE: "false"
      # ── Analítica de video ───────────────────────────────────
      # Secreto compartido con el servicio analytics (openssl rand -hex 32).
      # Vacío = endpoints de analítica deshabilitados.
      ANALYTICS_SECRET: ${ANALYTICS_SECRET:-}
      ANALYTICS_URL: http://analytics:8500
      ANALYTICS_MEDIAMTX_RTSP: rtsp://mediamtx:8554
      ANALYTICS_ALPR_ENABLED: ${ANALYTICS_ALPR_ENABLED:-false}
      # false = analytics SOLO usa el restream de MediaMTX (recomendado, no
      # tumba live view). true = permite fallback RTSP directo al NVR.
      ANALYTICS_ALLOW_DIRECT_RTSP: ${ANALYTICS_ALLOW_DIRECT_RTSP:-false}
      # Token opcional para /metrics (Prometheus). Vacío = red interna.
      METRICS_TOKEN: ${METRICS_TOKEN:-}
    volumes:
      - uploads_data:/app/uploads
      - recordings_cache:/var/lib/visioncore/recordings-cache
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    ports:
      - "4000:4000"
    networks:
      - visioncore_net
    # Allow the API container to resolve external hostnames (e.g. SMTP servers).
    # Docker's embedded resolver handles internal service names (postgres, redis, etc.)
    # regardless of this setting; these DNS servers are only used for external lookups.
    # If the SMTP server is on an internal network not reachable via public DNS, also
    # add an extra_hosts entry: "webmail.example.com:<REAL_IP>"
    dns:
      - 8.8.8.8
      - 1.1.1.1
    extra_hosts:
      - "host.docker.internal:host-gateway"

  # ─── Frontend (React + Nginx) ───────────────────────────────
  web:
    build:
      context: ./apps/web
      dockerfile: Dockerfile
    container_name: visioncore_web
    restart: unless-stopped
    depends_on:
      - api
    networks:
      - visioncore_net

  # ─── Analítica de video (Supervision + YOLOX/ONNX) ─────────
  # CPU por defecto. Para GPU NVIDIA ver apps/analytics/README.md.
  analytics:
    build:
      context: ./apps/analytics
      dockerfile: Dockerfile
    container_name: visioncore_analytics
    restart: unless-stopped
    environment:
      API_BASE_URL: http://api:4000
      ANALYTICS_SECRET: ${ANALYTICS_SECRET:-}
      ANALYTICS_PROVIDER: ${ANALYTICS_PROVIDER:-yolox_onnx}
      MODEL_PATH: /models/yolox_s.onnx
      INPUT_SIZE: "640"
      ANALYTICS_MAX_WORKERS: ${ANALYTICS_MAX_WORKERS:-16}
      ANALYTICS_FALL_DETECTION_ENABLED: ${ANALYTICS_FALL_DETECTION_ENABLED:-false}
      ANALYTICS_ALPR_ENABLED: ${ANALYTICS_ALPR_ENABLED:-false}
    volumes:
      - analytics_models:/models
    depends_on:
      - api
    networks:
      - visioncore_net
    # El modelo se descarga de GitHub al primer arranque
    dns:
      - 8.8.8.8
      - 1.1.1.1

  # ─── Nginx (reverse proxy + SSL) ───────────────────────────
  nginx:
    image: nginx:alpine
    container_name: visioncore_nginx
    restart: unless-stopped
    volumes:
      - ./infra/nginx/nginx.conf:/etc/nginx/nginx.conf:ro
      - certbot_conf:/etc/letsencrypt:ro
      - certbot_www:/var/www/certbot:ro
    ports:
      - "80:80"
      - "443:443"
    depends_on:
      - api
      - web
      - mediamtx
    networks:
      - visioncore_net

  # ─── Certbot (renovación automática SSL) ────────────────────
  certbot:
    image: certbot/certbot:latest
    container_name: visioncore_certbot
    restart: unless-stopped
    volumes:
      - certbot_conf:/etc/letsencrypt
      - certbot_www:/var/www/certbot
    entrypoint: "/bin/sh -c 'trap exit TERM; while :; do certbot renew --quiet; sleep 12h & wait $${!}; done;'"

volumes:
  postgres_data:
  redis_data:
  certbot_conf:
  certbot_www:
  uploads_data:
  recordings_cache:
  analytics_models:

networks:
  visioncore_net:
    driver: bridge
