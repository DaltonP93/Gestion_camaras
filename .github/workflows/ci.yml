name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

jobs:
  api:
    name: API (typecheck + tests)
    runs-on: ubuntu-latest
    # Servicios REALES y efímeros para las suites de integración (C23·H2): Redis
    # para grants/revocación y Postgres para la atomicidad SKIP LOCKED del outbox.
    # No son remotos ni de producción: contenedores desechables del propio job.
    services:
      redis:
        image: redis:7-alpine
        ports:
          - 6379:6379
        options: >-
          --health-cmd "redis-cli ping"
          --health-interval 5s --health-timeout 3s --health-retries 5
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_USER: ci
          POSTGRES_PASSWORD: ci
          POSTGRES_DB: ci
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U ci"
          --health-interval 5s --health-timeout 3s --health-retries 5
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: apps/api/package-lock.json
      - name: Install
        working-directory: apps/api
        run: npm ci
      - name: Prisma validate + generate
        working-directory: apps/api
        env:
          DATABASE_URL: postgresql://ci:ci@localhost:5432/ci
        run: |
          npx prisma validate --schema ../../prisma/schema.prisma
          npx prisma generate --schema ../../prisma/schema.prisma
      - name: Typecheck (build)
        working-directory: apps/api
        run: npm run build
      # La suite de video (src/playback-video) está excluida del build y vitest no
      # chequea tipos: sin este paso, un error de tipos en la suite o en su uso de la
      # API interna (getRecordingsMetrics, admission) pasaría CI.
      - name: Typecheck de la suite de video real
        working-directory: apps/api
        run: npm run typecheck:video
      - name: Tests
        working-directory: apps/api
        # Redis y Postgres REALES obligatorios: REQUIRE_* hace FALLAR (no omitir en
        # silencio) las suites de integración si el servicio no está disponible.
        env:
          REDIS_TEST_URL: redis://localhost:6379
          DATABASE_URL_TEST: postgresql://ci:ci@localhost:5432/ci
          REQUIRE_REAL_REDIS: '1'
          REQUIRE_REAL_PG: '1'
          # Señal EXPLÍCITA de que los servicios son efímeros/descartables del job
          # (contenedores del `services:`). Los harnesses NO ejecutan FLUSHDB /
          # DROP SCHEMA sin esta autorización (loopback por sí solo no basta).
          REDIS_TEST_DISPOSABLE: '1'
          PG_TEST_DISPOSABLE: '1'
        run: npm test

  web:
    name: Web (typecheck + tests + build)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: apps/web/package-lock.json
      - name: Install
        working-directory: apps/web
        run: npm ci
      - name: Tests
        working-directory: apps/web
        run: npm test
      - name: Build (incluye typecheck)
        working-directory: apps/web
        run: npm run build

  web-e2e:
    name: Web integración navegador (Playwright — ciclo de vida pantalla completa)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: apps/web/package-lock.json
      - name: Install
        working-directory: apps/web
        run: npm ci
      - name: Instalar Chromium (Playwright)
        working-directory: apps/web
        run: npx playwright install --with-deps chromium
      - name: E2E (liberación rápida de pantalla completa)
        working-directory: apps/web
        run: npm run test:e2e
      - name: Subir reporte en fallo
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: playwright-report
          path: apps/web/playwright-report/
          retention-days: 7

  playback-video:
    # Reproducción con VIDEO REAL generado al correr (nada versionado): web REAL
    # (bundle de producción) + server.ts REAL + FFmpeg REAL detrás de un NVR
    # SIMULADO (ISAPI en loopback + shim de ffmpeg). Sólo loopback; IP del NVR
    # ficticia. Ver apps/api/src/playback-video/README.md.
    #  - chromium: Chromium de Playwright (no decodifica H.264 → la SALIDA del
    #    FFmpeg se pasa a VP9 sólo para el navegador; desvío documentado). Bloquea.
    #  - chrome: Google Chrome del runner, comando H.264 REAL de punta a punta.
    #    No bloquea hasta confirmar en las primeras corridas que es estable.
    name: Reproducción con video real (NVR simulado · ${{ matrix.browser }})
    runs-on: ubuntu-latest
    timeout-minutes: 25
    continue-on-error: ${{ matrix.browser == 'chrome' }}
    strategy:
      fail-fast: false
      matrix:
        browser: [chromium, chrome]
    services:
      redis:
        image: redis:7-alpine
        ports:
          - 6379:6379
        options: >-
          --health-cmd "redis-cli ping"
          --health-interval 5s --health-timeout 3s --health-retries 5
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_USER: ci
          POSTGRES_PASSWORD: ci
          POSTGRES_DB: ci
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U ci"
          --health-interval 5s --health-timeout 3s --health-retries 5
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: |
            apps/api/package-lock.json
            apps/web/package-lock.json
      # ffmpeg/ffprobe REALES (sólo en el runner): generan las grabaciones sintéticas
      # y son el FFmpeg que lanza la API detrás del shim del NVR simulado.
      - name: Instalar ffmpeg
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y --no-install-recommends ffmpeg fonts-dejavu-core
          ffmpeg -hide_banner -version | head -1
      - name: Install API
        working-directory: apps/api
        run: npm ci
      - name: Install Web
        working-directory: apps/web
        run: npm ci
      - name: Prisma generate
        working-directory: apps/api
        env:
          DATABASE_URL: postgresql://ci:ci@localhost:5432/ci
        run: npx prisma generate --schema ../../prisma/schema.prisma
      - name: Navegador (Chromium de Playwright)
        if: matrix.browser == 'chromium'
        working-directory: apps/web
        run: npx playwright install --with-deps chromium
      - name: Navegador (Google Chrome del runner)
        if: matrix.browser == 'chrome'
        working-directory: apps/web
        run: |
          if [ ! -x /opt/google/chrome/chrome ]; then npx playwright install --with-deps chrome; fi
          /opt/google/chrome/chrome --version
      - name: Suite de video (S0–S8, X1)
        working-directory: apps/api
        env:
          REDIS_TEST_URL: redis://localhost:6379
          DATABASE_URL_TEST: postgresql://ci:ci@localhost:5432/ci
          REQUIRE_REAL_REDIS: '1'
          REQUIRE_REAL_PG: '1'
          REDIS_TEST_DISPOSABLE: '1'
          PG_TEST_DISPOSABLE: '1'
          VIDEO_BROWSER: ${{ matrix.browser }}
          # Con Chrome se exige H.264 (sin desvío VP9): si no decodifica, falla.
          VIDEO_REQUIRE_H264: ${{ matrix.browser == 'chrome' && '1' || '0' }}
          VIDEO_REPORT_DIR: ${{ runner.temp }}/video-reports
        run: npm run test:video
      # Sólo reportes de medición (JSON/Markdown saneados): nunca video ni imágenes.
      - name: Subir reportes de medición
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: playback-video-reports-${{ matrix.browser }}
          path: |
            ${{ runner.temp }}/video-reports/**/*.json
            ${{ runner.temp }}/video-reports/**/*.md
            ${{ runner.temp }}/video-reports/**/*.txt
          retention-days: 14
          if-no-files-found: ignore

  lint:
    name: Lint (ESLint — errores bloquean)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      # ESLint bloquea sólo ERRORES (reglas de bug reales: no-unused-expressions,
      # rules-of-hooks, recommended de js/tseslint, etc.). Los warnings (unused-vars,
      # exhaustive-deps) se muestran pero NO rompen CI (rollout escalonado).
      - name: Lint API
        working-directory: apps/api
        run: npm ci --ignore-scripts && npm run lint
      - name: Lint Web
        working-directory: apps/web
        run: npm ci --ignore-scripts && npm run lint

  analytics:
    name: Analytics (syntax + tests)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Syntax check (compileall)
        working-directory: apps/analytics
        run: python -m compileall -q app
      - name: Pure tests (stdlib, sin cv2/onnx)
        working-directory: apps/analytics
        run: python -m unittest discover -s tests -v

  compose:
    name: docker compose config
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Validar docker-compose.yml
        run: docker compose -f docker-compose.yml config -q
      # Contrato del cableado de auth_request del HLS: X-Original-URI debe llevar la
      # URI del request PADRE (set $hls_original_uri $uri en /hls/), no la del
      # subrequest. Evita reintroducir el incidente HLS (BAD_PATH/403).
      - name: Guard auth_request HLS (X-Original-URI del request padre)
        run: bash scripts/check-hls-auth-nginx.sh
      - name: Sintaxis del guard (bash -n)
        run: bash -n scripts/check-hls-auth-nginx.sh
      # Runbook de deploy HLS: sintaxis + pruebas negativas de sus compuertas
      # (cada compuerta crítica debe abortar con exit != 0). No toca producción.
      - name: Sintaxis runbook deploy HLS (bash -n)
        run: |
          bash -n scripts/deploy-hls-auth-bootstrap.sh
          bash -n scripts/deploy-hls-auth-parent-uri.sh
          bash -n scripts/deploy-hls-auth-parent-uri.test.sh
      - name: Pruebas negativas del runbook + bootstrap de deploy HLS
        run: bash scripts/deploy-hls-auth-parent-uri.test.sh

  migrations:
    name: Prefijos de migración (sin duplicados nuevos)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      # Falla si se agrega un prefijo numérico de migración duplicado NUEVO.
      # Los duplicados históricos 0009/0031 están en una allowlist explícita
      # dentro del script (no se renombran: romperían _prisma_migrations).
      - name: Verificar prefijos de migración
        run: bash scripts/check-migration-prefixes.sh

  cert-lineage:
    name: Linaje de certificado TLS (camaras-le consistente)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      # Falla si se reintroduce la ruta del linaje viejo/inválido o si nginx,
      # los scripts de certbot y el compose dejan de coincidir en `camaras-le`.
      # También impide comitear certificados/llaves reales (ver el script).
      - name: Verificar linaje de certificado
        run: bash scripts/check-cert-lineage.sh
      - name: Sintaxis de scripts de certbot (bash -n)
        run: |
          bash -n infra/certbot/init-ssl.sh
          bash -n infra/certbot/upgrade-to-https.sh
          bash -n scripts/check-cert-lineage.sh
          bash -n infra/certbot/init-ssl.test.sh
      # Ejercita el FLUJO de bootstrap de init-ssl.sh con Docker mockeado (estado
      # vacío, dummy interrumpido y linaje administrado). Sin red ni contenedores.
      - name: Bootstrap init-ssl.sh (docker mockeado)
        run: bash infra/certbot/init-ssl.test.sh

  analytics-image:
    name: Analytics image (native deps smoke test)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      # El build ejecuta el smoke test `import cv2, onnxruntime, supervision`
      # en su última capa (ver apps/analytics/Dockerfile). Si falta libGL u
      # otra librería nativa, el build falla acá y no llega a producción.
      - name: Build analytics image (falla si cv2/onnxruntime/supervision no importan)
        run: docker build -t visioncore-analytics:ci apps/analytics
      - name: Verificar imports nativos en el contenedor
        run: |
          docker run --rm visioncore-analytics:ci \
            python -c "import cv2, onnxruntime, supervision; print('imports OK')"

  audit:
    name: npm audit (prod HIGH/CRITICAL)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      # Política (ver docs/audits/AUDIT_DEVOPS.md): `npm audit --omit=dev` sólo
      # sobre dependencias de PRODUCCIÓN (dev-only NO bloquea); low/moderate NO
      # bloquean. Allowlist de deuda VACÍO (los HIGH transitivos axios/form-data
      # fueron remediados por #172): cualquier HIGH/CRITICAL prod rompe CI.
      - name: Self-test fail-closed de la política de audit (pruebas negativas)
        run: bash scripts/check-npm-audit.test.sh
      - name: Auditar dependencias de producción (api + web)
        run: bash scripts/check-npm-audit.sh apps/api apps/web

  licenses:
    name: Licencias (sin GPL/AGPL)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Instalar deps de producción
        run: |
          (cd apps/api && npm ci --omit=dev --ignore-scripts)
          (cd apps/web && npm ci --omit=dev --ignore-scripts)
      - name: Verificar que no haya GPL/AGPL en producción
        run: |
          set -e
          for app in apps/api apps/web; do
            echo "== $app"
            bad=$(cd "$app" && npx --yes license-checker --production --csv 2>/dev/null \
              | grep -iE 'agpl|,"?GPL' | grep -vi lgpl || true)
            if [ -n "$bad" ]; then
              echo "❌ Dependencias con licencia GPL/AGPL detectadas:"
              echo "$bad"
              exit 1
            fi
          done
          echo "✅ Sin GPL/AGPL en dependencias de producción"
