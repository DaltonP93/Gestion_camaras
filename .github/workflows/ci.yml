name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

jobs:
  api:
    name: API (typecheck + tests)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: apps/api/package-lock.json
      - name: Install
        working-directory: apps/api
        run: npm ci
      - name: Prisma validate + generate
        working-directory: apps/api
        env:
          DATABASE_URL: postgresql://ci:ci@localhost:5432/ci
        run: |
          npx prisma validate --schema ../../prisma/schema.prisma
          npx prisma generate --schema ../../prisma/schema.prisma
      - name: Typecheck (build)
        working-directory: apps/api
        run: npm run build
      - name: Tests
        working-directory: apps/api
        run: npm test

  web:
    name: Web (typecheck + tests + build)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: apps/web/package-lock.json
      - name: Install
        working-directory: apps/web
        run: npm ci
      - name: Tests
        working-directory: apps/web
        run: npm test
      - name: Build (incluye typecheck)
        working-directory: apps/web
        run: npm run build

  analytics:
    name: Analytics (syntax + tests)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Syntax check (compileall)
        working-directory: apps/analytics
        run: python -m compileall -q app
      - name: Pure tests (stdlib, sin cv2/onnx)
        working-directory: apps/analytics
        run: python -m unittest discover -s tests -v

  compose:
    name: docker compose config
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Validar docker-compose.yml
        run: docker compose -f docker-compose.yml config -q

  licenses:
    name: Licencias (sin GPL/AGPL)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Instalar deps de producción
        run: |
          (cd apps/api && npm ci --omit=dev --ignore-scripts)
          (cd apps/web && npm ci --omit=dev --ignore-scripts)
      - name: Verificar que no haya GPL/AGPL en producción
        run: |
          set -e
          for app in apps/api apps/web; do
            echo "== $app"
            bad=$(cd "$app" && npx --yes license-checker --production --csv 2>/dev/null \
              | grep -iE 'agpl|,"?GPL' | grep -vi lgpl || true)
            if [ -n "$bad" ]; then
              echo "❌ Dependencias con licencia GPL/AGPL detectadas:"
              echo "$bad"
              exit 1
            fi
          done
          echo "✅ Sin GPL/AGPL en dependencias de producción"
