# infra/mediamtx/mediamtx.yml
# Configuración de MediaMTX — Proxy RTSP → HLS/WebRTC

###############################################
# General
###############################################
logLevel: info
logDestinations: [stdout]
logFile: ""

readTimeout: 10s
writeTimeout: 10s
writeQueueSize: 4096

###############################################
# Auth — permitir todo sin credenciales
# Compatible con MediaMTX v0.x y v1.x
###############################################
authInternalUsers:
  - user: any
    pass: any
    permissions:
      - action: api
      - action: read
      - action: publish
      - action: playback

###############################################
# API de administración (usada por el backend)
###############################################
api: yes
apiAddress: :9997
apiEncryption: no

metrics: yes
metricsAddress: :9998

###############################################
# Protocolos de entrada
###############################################
protocols: [tcp]

rtspAddress: :8554
rtspsAddress: :8322
rtpAddress: :8000
rtcpAddress: :8001

###############################################
# HLS (para el frontend web)
###############################################
hls: yes
hlsAddress: :8888
hlsVariant: lowLatency
hlsSegmentCount: 3
hlsSegmentDuration: 2s
hlsPartDuration: 200ms
hlsSegmentMaxSize: 50MB
hlsEncryption: no
hlsAllowOrigin: "*"
hlsAlwaysRemux: no

###############################################
# WebRTC (latencia ultra baja ~500ms)
###############################################
webrtc: yes
webrtcAddress: :8889
webrtcICEServers2: []
webrtcAllowOrigin: "*"

###############################################
# Paths
# Las rutas NVR se crean dinámicamente vía API
# con source: rtsp://... y sourceOnDemand: true
# NO poner source: publisher acá — eso impide el pull
###############################################
paths:
  ~^nvr_.*:
    sourceOnDemandStartTimeout: 15s
    sourceOnDemandCloseAfter: 30s
    record: no
    overridePublisher: yes

  ~^test.*:
    source: publisher

  "~.*":
    source: publisher
