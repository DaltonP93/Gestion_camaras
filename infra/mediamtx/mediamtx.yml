# infra/mediamtx/mediamtx.yml
# Configuración de MediaMTX — Proxy RTSP → HLS/WebRTC

###############################################
# General
###############################################
logLevel: info
logDestinations: [stdout]
logFile: ""

readTimeout: 10s
writeTimeout: 10s
writeQueueSize: 4096

###############################################
# Auth — permitir todo sin credenciales
###############################################
authInternalUsers:
  - user: any
    permissions:
      - action: api
      - action: read
      - action: publish
      - action: playback

###############################################
# API de administración (usada por el backend)
###############################################
api: yes
apiAddress: :9997
apiEncryption: no

metrics: yes
metricsAddress: :9998

###############################################
# Protocolos de entrada
###############################################
protocols: [tcp]

rtspAddress: :8554
rtspsAddress: :8322
rtpAddress: :8000
rtcpAddress: :8001

###############################################
# HLS (para el frontend web)
###############################################
hls: yes
hlsAddress: :8888
# fmp4 handles B-frames and reordered DTS natively; mpegts fails with "too many reordered frames"
hlsVariant: fmp4
hlsSegmentCount: 4
hlsSegmentDuration: 2s
hlsSegmentMaxSize: 50MB
hlsMuxerCloseAfter: 10m
hlsEncryption: no
hlsAllowOrigin: "*"
hlsAlwaysRemux: no

###############################################
# WebRTC (latencia ultra baja ~500ms)
###############################################
webrtc: yes
webrtcAddress: :8889
webrtcICEServers2: []
webrtcAllowOrigin: "*"

###############################################
# Defaults para todos los paths
# rtspTransport: tcp fuerza TCP al conectar a fuentes RTSP (evita pérdida RTP UDP)
# El payload de la API también incluye rtspTransport: tcp por redundancia
###############################################
pathDefaults:
  rtspTransport: tcp

###############################################
# Paths
# Las rutas NVR se crean dinámicamente vía API
# con source: rtsp://... y sourceOnDemand: true
# NO poner source: publisher acá — eso impide el pull
###############################################
paths:
  ~^nvr_.*:
    sourceOnDemandStartTimeout: 15s
    sourceOnDemandCloseAfter: 10m
    record: no
    overridePublisher: yes

  ~^test.*:
    source: publisher

  "~.*":
    source: publisher
