# infra/nginx/nginx.conf — HTTPS + HLS fix para VisionCore

worker_processes auto;
error_log /var/log/nginx/error.log warn;
pid /var/run/nginx.pid;

events {
    worker_connections 1024;
    use epoll;
    multi_accept on;
}

http {
    include       /etc/nginx/mime.types;
    default_type  application/octet-stream;

    map $http_upgrade $connection_upgrade {
        default upgrade;
        ''      close;
    }

    log_format main '$remote_addr - $remote_user [$time_local] '
                    '"$request" $status $body_bytes_sent '
                    '"$http_referer" "$http_user_agent"';

    access_log /var/log/nginx/access.log main;

    sendfile on;
    tcp_nopush on;
    tcp_nodelay on;
    keepalive_timeout 65;
    gzip on;
    gzip_types text/plain text/css application/json application/javascript text/xml application/xml;
    client_max_body_size 100M;

    upstream api          { server api:4000;      keepalive 32; }
    upstream web          { server web:80;        keepalive 16; }
    upstream mediamtx_hls { server mediamtx:8888; keepalive 16; }

    server {
        listen 80;
        server_name camaras.saa.com.py;

        location /.well-known/acme-challenge/ {
            root /var/www/certbot;
        }

        location / {
            return 301 https://$host$request_uri;
        }
    }

    server {
        listen 443 ssl http2;
        server_name camaras.saa.com.py;

        ssl_certificate     /etc/letsencrypt/live/camaras.saa.com.py/fullchain.pem;
        ssl_certificate_key /etc/letsencrypt/live/camaras.saa.com.py/privkey.pem;

        ssl_session_timeout 1d;
        ssl_session_cache shared:SSL:10m;
        ssl_session_tickets off;
        ssl_protocols TLSv1.2 TLSv1.3;
        ssl_prefer_server_ciphers off;

        add_header Strict-Transport-Security "max-age=63072000; includeSubDomains" always;
        add_header X-Content-Type-Options nosniff always;
        add_header X-Frame-Options SAMEORIGIN always;

        # Static uploads (branding logos, favicons) served via the API container
        location /uploads/ {
            proxy_pass http://api;
            proxy_http_version 1.1;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;
            proxy_cache_bypass 0;
            add_header Cache-Control "public, max-age=86400" always;
        }

        # ── fMP4 preview stream — must come before /api/ to disable buffering ──
        # Nginx buffers proxied responses by default (~8 KB); without proxy_buffering off
        # the chunked fMP4 stream stalls until nginx fills its buffer → blank video.
        location /api/recordings/preview/ {
            proxy_pass http://api;
            proxy_http_version 1.1;

            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;

            proxy_buffering off;
            proxy_request_buffering off;
            proxy_cache off;

            proxy_read_timeout 3600s;
            proxy_send_timeout 3600s;
            proxy_connect_timeout 30s;
        }

        location /api/ {
            proxy_pass http://api;
            proxy_http_version 1.1;

            proxy_set_header Upgrade $http_upgrade;
            proxy_set_header Connection $connection_upgrade;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;

            proxy_read_timeout 3600s;
            proxy_send_timeout 3600s;
            proxy_connect_timeout 30s;
        }

        location /ws/ {
            proxy_pass http://api;
            proxy_http_version 1.1;

            proxy_set_header Upgrade $http_upgrade;
            proxy_set_header Connection $connection_upgrade;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;

            proxy_read_timeout 3600s;
            proxy_send_timeout 3600s;
            proxy_connect_timeout 30s;
        }

        # ── HLS streams — same-origin con withCredentials ──────────
        # SPA y HLS están en el mismo dominio (mismo nginx), no se necesitan
        # headers CORS. Se oculta el "Access-Control-Allow-Origin: *" de MediaMTX
        # porque es incompatible con withCredentials=true en HLS.js.
        location /hls/ {
            proxy_pass http://mediamtx_hls/;
            proxy_http_version 1.1;

            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;

            proxy_buffering off;
            proxy_request_buffering off;
            proxy_cache off;
            proxy_cache_bypass 1;

            proxy_read_timeout 3600s;
            proxy_send_timeout 3600s;
            proxy_connect_timeout 30s;

            proxy_redirect ~^/(.*)$ /hls/$1;

            # MediaMTX sets Set-Cookie with Path=/stream-name/ (its own path, without /hls/ prefix).
            # Without this rewrite the browser scopes the cookie to /stream-name/ which never matches
            # subsequent HLS requests under /hls/stream-name/ → every main_stream.m3u8 gets 401.
            proxy_cookie_path ~^/(.*)$ /hls/$1;

            proxy_hide_header Access-Control-Allow-Origin;
            add_header Cache-Control "no-cache, no-store, must-revalidate" always;

            if ($request_method = OPTIONS) {
                return 204;
            }
        }

        # Security: block hidden files (except .well-known) and common attack paths
        location ~ /\.(?!well-known) {
            return 404;
        }
        location ~* ^/(vendor|phpunit|composer\.(json|lock)|package-lock\.json|\.env|\.git|wp-admin|wp-login|phpmyadmin|xmlrpc\.php|containers|actuator|\.DS_Store) {
            return 404;
        }

        location / {
            proxy_pass http://web;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_intercept_errors on;
            error_page 404 = @spa_fallback;
        }

        location @spa_fallback {
            proxy_pass http://web;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
        }
    }
}
