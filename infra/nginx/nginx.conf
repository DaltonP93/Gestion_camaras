# infra/nginx/nginx.conf — HTTPS + HLS fix para VisionCore

worker_processes auto;
error_log /var/log/nginx/error.log warn;
pid /var/run/nginx.pid;

events {
    worker_connections 1024;
    use epoll;
    multi_accept on;
}

http {
    include       /etc/nginx/mime.types;
    default_type  application/octet-stream;

    map $http_upgrade $connection_upgrade {
        default upgrade;
        ''      close;
    }

    # Se registra $uri (path normalizado SIN query string) en vez de $request,
    # para no dejar tokens del query en el access log de nginx (p.ej.
    # /ws/alerts?token=<JWT>, /recordings/.../stream?token=...). El método va aparte.
    log_format main '$remote_addr - $remote_user [$time_local] '
                    '"$request_method $uri $server_protocol" $status $body_bytes_sent '
                    '"$http_referer" "$http_user_agent"';

    access_log /var/log/nginx/access.log main;

    sendfile on;
    tcp_nopush on;
    tcp_nodelay on;
    keepalive_timeout 65;
    gzip on;
    gzip_types text/plain text/css application/json application/javascript text/xml application/xml;
    client_max_body_size 100M;

    upstream api          { server api:4000;      keepalive 32; }
    upstream web          { server web:80;        keepalive 16; }
    upstream mediamtx_hls { server mediamtx:8888; keepalive 16; }

    server {
        listen 80;
        server_name camaras.saa.com.py;

        location /.well-known/acme-challenge/ {
            root /var/www/certbot;
        }

        location / {
            return 301 https://$host$request_uri;
        }
    }

    server {
        listen 443 ssl http2;
        server_name camaras.saa.com.py;

        # NOTA sobre `$hls_original_uri` (ver /hls/ e /internal/hls-auth): NO se
        # inicializa a nivel `server`. Las subrequests de auth_request COMPARTEN el
        # array de variables con el request padre; un `set $hls_original_uri ""` en
        # `server` se re-ejecutaría en la fase rewrite de la subrequest y BORRARÍA el
        # valor capturado por /hls/ (el API recibiría vacío ⇒ 403 para todo stream).
        # Una variable de `set` no seteada en un path evalúa a "" en proxy_set_header
        # (nginx omite el header), lo que ya es fail-closed para otros contextos. Por
        # eso NO hay init a nivel server: rompería el mecanismo.

        # Linaje canónico del certificado = `camaras-le` (NO el dominio). El linaje
        # antiguo `camaras.saa.com.py` contenía un cert de CA privada y su renewal
        # config quedó inválida; el válido de Let's Encrypt vive en `camaras-le`.
        # init-ssl.sh emite con `--cert-name camaras-le` y el contenedor certbot
        # renueva sólo ese linaje, así que estas rutas son la única fuente de verdad.
        ssl_certificate     /etc/letsencrypt/live/camaras-le/fullchain.pem;
        ssl_certificate_key /etc/letsencrypt/live/camaras-le/privkey.pem;

        ssl_session_timeout 1d;
        ssl_session_cache shared:SSL:10m;
        ssl_session_tickets off;
        ssl_protocols TLSv1.2 TLSv1.3;
        ssl_prefer_server_ciphers off;

        add_header Strict-Transport-Security "max-age=63072000; includeSubDomains" always;
        add_header X-Content-Type-Options nosniff always;
        add_header X-Frame-Options SAMEORIGIN always;

        # Static uploads (branding logos, favicons) served via the API container
        location /uploads/ {
            proxy_pass http://api;
            proxy_http_version 1.1;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;
            proxy_cache_bypass 0;
            add_header Cache-Control "public, max-age=86400" always;
        }

        # ── Sub-request interno de autorización del HLS (P1) ──
        # No accesible desde afuera (`internal;`). Recibe la cookie de sesión del
        # request original (nginx reenvía las cabeceras) y la URI pedida en
        # X-Original-URI; el API responde 200 (permitir) / 401 / 403. Sin cuerpo.
        location = /internal/hls-auth {
            internal;
            proxy_pass http://api/internal/hls-auth;
            proxy_http_version 1.1;
            proxy_pass_request_body off;
            proxy_set_header Content-Length "";
            proxy_set_header Host $host;
            # X-Original-URI = URI del request HLS PADRE, capturada en /hls/ como
            # `$hls_original_uri` (NORMALIZADA: colapsa ../). NO usar `$uri` aquí: en el
            # subrequest vale `/internal/hls-auth` y el API respondería BAD_PATH/403 para
            # todos los streams (incidente HLS). NO usar `$request_uri` (crudo): debe
            # coincidir EXACTAMENTE con el path normalizado que /hls/ proxya a MediaMTX,
            # o un `curl --path-as-is` podría autorizar una cámara y hacer servir otra
            # (.../nvr_X_ch01_sub/../nvr_X_ch02_sub/...). Ver auditoría P1 + incidente HLS.
            proxy_set_header X-Original-URI $hls_original_uri;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        }

        # ── fMP4 preview stream — must come before /api/ to disable buffering ──
        # Nginx buffers proxied responses by default (~8 KB); without proxy_buffering off
        # the chunked fMP4 stream stalls until nginx fills its buffer → blank video.
        location /api/recordings/preview/ {
            proxy_pass http://api;
            proxy_http_version 1.1;

            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;

            proxy_buffering off;
            proxy_request_buffering off;
            proxy_cache off;

            proxy_read_timeout 3600s;
            proxy_send_timeout 3600s;
            proxy_connect_timeout 30s;
        }

        location /api/ {
            proxy_pass http://api;
            proxy_http_version 1.1;

            proxy_set_header Upgrade $http_upgrade;
            proxy_set_header Connection $connection_upgrade;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;

            proxy_read_timeout 3600s;
            proxy_send_timeout 3600s;
            proxy_connect_timeout 30s;
        }

        location /ws/ {
            proxy_pass http://api;
            proxy_http_version 1.1;

            proxy_set_header Upgrade $http_upgrade;
            proxy_set_header Connection $connection_upgrade;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;

            proxy_read_timeout 3600s;
            proxy_send_timeout 3600s;
            proxy_connect_timeout 30s;
        }

        # ── HLS streams — same-origin con withCredentials ──────────
        # SPA y HLS están en el mismo dominio (mismo nginx), no se necesitan
        # headers CORS. Se oculta el "Access-Control-Allow-Origin: *" de MediaMTX
        # porque es incompatible con withCredentials=true en HLS.js.
        location /hls/ {
            # ── P1: autorización del HLS por ESPECTADOR (cookie de sesión + canView) ──
            # Antes de proxyear a MediaMTX, nginx consulta al API si esta sesión puede
            # ver la cámara del streamPath pedido. 401/403 ⇒ corta aquí (MediaMTX ni se
            # toca). MediaMTX debe permanecer SOLO-INTERNO (este es el único camino).
            # Rollback: comentar las dos líneas de abajo (`set` + `auth_request`).
            #
            # IMPRESCINDIBLE: capturar AQUÍ (en el request PADRE) la URI HLS normalizada.
            # Durante auth_request, dentro de /internal/hls-auth, `$uri` vale
            # `/internal/hls-auth` (la URI del SUBREQUEST), NO la del request HLS padre;
            # pasar ese `$uri` hacía que el API recibiera una ruta inválida → BAD_PATH/403
            # y MediaMTX cerraba los streams on-demand por falta de lectores. `$uri` del
            # padre YA está normalizado (colapsa `../`), así que conserva la protección
            # anti path-traversal sin usar `$request_uri` crudo.
            set $hls_original_uri $uri;
            auth_request /internal/hls-auth;

            proxy_pass http://mediamtx_hls/;
            proxy_http_version 1.1;

            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;

            proxy_buffering off;
            proxy_request_buffering off;
            proxy_cache off;
            proxy_cache_bypass 1;

            proxy_read_timeout 3600s;
            proxy_send_timeout 3600s;
            proxy_connect_timeout 30s;

            proxy_redirect ~^/(.*)$ /hls/$1;

            # MediaMTX sets Set-Cookie with Path=/stream-name/ (its own path, without /hls/ prefix).
            # Without this rewrite the browser scopes the cookie to /stream-name/ which never matches
            # subsequent HLS requests under /hls/stream-name/ → every main_stream.m3u8 gets 401.
            proxy_cookie_path ~^/(.*)$ /hls/$1;

            proxy_hide_header Access-Control-Allow-Origin;
            add_header Cache-Control "no-cache, no-store, must-revalidate" always;

            if ($request_method = OPTIONS) {
                return 204;
            }
        }

        # Security: block hidden files (except .well-known) and common attack paths
        location ~ /\.(?!well-known) {
            return 404;
        }
        location ~* ^/(vendor|phpunit|composer\.(json|lock)|package-lock\.json|\.env|\.git|wp-admin|wp-login|phpmyadmin|xmlrpc\.php|containers|actuator|\.DS_Store) {
            return 404;
        }

        location / {
            proxy_pass http://web;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_intercept_errors on;
            error_page 404 = @spa_fallback;
        }

        location @spa_fallback {
            proxy_pass http://web;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
        }
    }
}
